<!DOCTYPE html>
<html>
<head>
  <title>Register</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <h1>Register</h1>

  <input id="regName" type="text" placeholder="Enter name">
  <input id="regEmail" type="email" placeholder="Enter email">
  <input id="regPass" type="password" placeholder="Enter password">

  <button id="registerBtn">Register</button>

  <p>Already have account?</p>
  <button onclick="goToLogin()">Login Here</button>

</div>

<script src="register.js"></script>

<script>
function goToLogin(){
  window.location.href = "index.html";
}
</script>

</body>
</html>
